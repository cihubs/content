<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tu futuro como emprendedor en tecnología — CIHUBS</title>
    <script src="https://cdn.jsdelivr.net/npm/hyperframes@0.8.111/dist/hyperframes-player.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hyperframes@0.8.111/dist/hyperframes-slideshow.global.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    </style>
  </head>
  <body>
    <hyperframes-slideshow
      tabindex="0"
      notes-storage-key="cihubs-acompanamiento-colegiales"
      style="display: block; position: relative; width: 100vw; height: 100vh"
    >
      <hyperframes-player
        interactive
        style="position: absolute; inset: 0"
        src="composition/index.html"
      ></hyperframes-player>
      <script type="application/hyperframes-slideshow+json">
        {
          "slides": [
            { "sceneId": "cover", "notes": "Bienvenida. Charla presencial Tu futuro como emprendedor en tecnología. Audiencia: estudiantes del Colegio Técnico Profesional de Guararí, futuros founders." },
            { "sceneId": "hook", "notes": "Gancho: su proyecto de colegio ya es una semilla. Pausa en la pregunta." },
            { "sceneId": "problem", "notes": "El dolor: las ideas mueren sin ruta al mercado. Sin culpables, solo el gap." },
            { "sceneId": "cihubs", "notes": "Quiénes somos: dinamizadores del ecosistema. Conectamos generadores y usuarios de conocimiento." },
            { "sceneId": "ruta", "notes": "La metodología en 3 pasos. Entran los 3 juntos, sin staging." },
            { "sceneId": "descubrimiento", "notes": "Discovery promovido a slide propio: Etapa I, 3 meses, tours y bootcamps. Footnote cihubs.com/programas-discovery." },
            { "sceneId": "acompanamiento", "notes": "Qué incluye el acompañamiento. Cerrar con que es para ideas en cualquier etapa." },
            { "sceneId": "puerta", "notes": "Solo Inmersión: Etapa II por resultados, clientes, talento y capital. Footnote cihubs.com/programas-inmersion." },
            { "sceneId": "call-to-action", "notes": "Cierre fusionado: nos vemos en la próxima Expo Técnica + contacto juanignacio@cihubs.com." }
          ],
          "slideSequences": []
        }
      </script>
    </hyperframes-slideshow>
    <script>
      // Deep-link: ?slide=N (1-based) or ?t=seconds. The player initializes
      // asynchronously (composition timeline arrives after iframe load), so a
      // one-shot seek can be overwritten by init. This loop re-seeks until the
      // target scene is actually visible (or 8s pass). Prefers the slideshow
      // controller (keeps nav counter in sync), falls back to the iframe.
      (function () {
        var m = /[?&](?:slide|t)=([^&]+)/.exec(location.search);
        if (!m) return;
        var SCENES = ["cover", "hook", "problem", "cihubs", "ruta", "descubrimiento", "acompanamiento", "puerta", "call-to-action"];
        var isSlide = location.search.indexOf("slide=") !== -1;
        var idx, time;
        if (isSlide) {
          var n = parseInt(decodeURIComponent(m[1]), 10);
          if (!(n >= 1 && n <= SCENES.length)) return;
          idx = n - 1;
          time = idx * 8 + 0.01;
        } else {
          time = parseFloat(m[1]);
          if (!isFinite(time) || time < 0) return;
          idx = Math.min(Math.floor(time / 8), SCENES.length - 1);
        }
        var targetId = "scene-" + SCENES[idx];
        function frameDoc() {
          try {
            var player = document.querySelector("hyperframes-player");
            var frame = player && player.shadowRoot && player.shadowRoot.querySelector("iframe");
            return frame && frame.contentDocument;
          } catch (e) { return null; }
        }
        function isActive() {
          var d = frameDoc();
          if (!d) return false;
          var el = d.getElementById(targetId);
          if (!el) return false;
          var cs = el.ownerDocument.defaultView.getComputedStyle(el);
          return cs.visibility === "visible" && parseFloat(cs.opacity) > 0.5;
        }
        function seek() {
          try {
            var show = document.querySelector("hyperframes-slideshow");
            if (show && show.controller && show.controller.goToSlide) {
              show.controller.goToSlide(idx);
              return;
            }
          } catch (e) {}
          try {
            var d = frameDoc();
            var w = d && d.defaultView;
            if (w && w.__hfSetTime) w.__hfSetTime(time);
          } catch (e2) {}
        }
        var deadline = Date.now() + 8000;
        var timer = setInterval(function () {
          if (isActive() || Date.now() > deadline) {
            clearInterval(timer);
            return;
          }
          seek();
        }, 250);
      })();
    </script>
  </body>
</html>
