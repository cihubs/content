<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CIHUBS · Content</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "Montserrat", "Open Sans", system-ui, sans-serif;
        background: #f7f9fc;
        color: #203370;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 64px 24px;
      }
      header { text-align: center; margin-bottom: 48px; }
      header .brand {
        font-family: "Poppins", system-ui, sans-serif;
        font-weight: 700;
        font-size: 40px;
        letter-spacing: 6px;
      }
      header p { margin-top: 12px; font-size: 20px; color: #4a6fa5; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 24px;
        width: 100%;
        max-width: 960px;
      }
      .card {
        background: #ffffff;
        border: 1px solid #b8d4ea;
        border-radius: 16px;
        padding: 32px;
        text-decoration: none;
        color: inherit;
        box-shadow: 0 4px 16px rgba(32, 51, 112, 0.08);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 32px rgba(32, 51, 112, 0.16);
      }
      .card .kind {
        display: inline-block;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #ffffff;
        background: #203370;
        border-radius: 999px;
        padding: 6px 14px;
        margin-bottom: 16px;
      }
      .card h2 {
        font-family: "Poppins", system-ui, sans-serif;
        font-size: 26px;
        margin-bottom: 12px;
      }
      .card p { font-size: 16px; color: #333333; line-height: 1.5; }
      .card .go { display: block; margin-top: 20px; font-weight: 700; color: #2a4289; }
      footer { margin-top: 64px; font-size: 14px; color: #4a6fa5; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">CIHUBS</div>
      <p>Explorador de contenido — decks y recursos</p>
    </header>
    <main class="grid">
      <a class="card" href="decks/acompanamiento-colegiales/">
        <span class="kind">Deck</span>
        <h2>La ruta del emprendedor tecnológico</h2>
        <p>Programa de acompañamiento CIHUBS para futuros founders de colegios técnicos. 8 slides + notas de presentador.</p>
        <span class="go">Abrir presentación →</span>
      </a>
    </main>
    <footer>CIHUBS · cihubs.com · info@cihubs.com</footer>
  </body>
</html>
